name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # اندروید SDK از قبل روی ران‌رهای GitHub نصب است (ANDROID_HOME)،
      # پس مرحله‌ی android-actions/setup-android لازم نیست (آن مرحله به‌خاطر پکیج «tools» خطا می‌داد).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LicenseAdmin.apk

      - name: Show APK signature fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs LicenseAdmin.apk | grep -E "SHA-256|Signer #1"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LicenseAdmin-apk
          path: LicenseAdmin.apk

      - name: Attach APK to GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LicenseAdmin.apk
