plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barber.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.barber.admin"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.0"
    }

    signingConfigs {
        fixed {
            storeFile file('admin-debug.keystore')
            storePassword 'android'
            keyAlias 'admin'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
